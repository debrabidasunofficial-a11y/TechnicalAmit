    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raja Technician Services | Professional Appliance Repair</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#0a2540;
    --accent:#1db954;
    --light:#f5f7fa;
    --dark:#111;
    --danger:#e63946;
}

*{box-sizing:border-box;}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--light);
    color:#333;
}

/* HERO */
header{
    background:linear-gradient(135deg,#0a2540,#102a43);
    color:#fff;
    padding:80px 20px;
    text-align:center;
}

header h1{
    font-size:38px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
    opacity:.95;
}

.hero-btn{
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:8px;
    font-weight:600;
    text-decoration:none;
    margin:6px;
    transition:.3s;
}

.btn-primary{
    background:var(--accent);
    color:#fff;
}

.btn-danger{
    background:var(--danger);
    color:#fff;
}

.btn:hover{
    transform:translateY(-2px);
    opacity:.95;
}

/* SECTIONS */
section{
    max-width:1200px;
    margin:auto;
    padding:70px 20px;
}

h2{
    text-align:center;
    color:var(--primary);
    font-size:30px;
    margin-bottom:40px;
}

/* SERVICES */
.services{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.service-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.3s;
}

.service-card:hover{
    transform:translateY(-6px);
}

.service-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.service-card div{
    padding:20px;
}

.service-card h3{
    margin:0;
    color:#0a2540;
}

/* BOOKING */
.booking{
    background:#fff;
    border-radius:18px;
    padding:40px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);
    max-width:700px;
    margin:auto;
}

label{
    font-weight:500;
    display:block;
    margin-top:18px;
}

input,select,textarea{
    width:100%;
    padding:14px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
    font-family:'Poppins';
}

textarea{
    resize:none;
    height:100px;
}

/* FOOTER */
footer{
    background:#0a2540;
    color:#ccc;
    text-align:center;
    padding:25px;
}

/* FLOATING BUTTONS */
.floating{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.float-btn{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:24px;
    text-decoration:none;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.call{background:var(--danger);}
.whatsapp{background:#25D366;}
</style>
</head>

<body>

<!-- HERO -->
<header>
    <h1>Raja Technician Services</h1>
    <p>Trusted AC, Refrigerator, Cooler & Fan Repair at Your Doorstep</p>
    <div class="hero-btn">
        <a href="#booking" class="btn btn-primary">Book Service</a>
        <a href="tel:9XXXXXXXXX" class="btn btn-danger">Call Now</a>
    </div>
</header>

<!-- SERVICES -->
<section>
<h2>Our Services</h2>

<div class="services">

<div class="service-card" onclick="selectService('AC')">
<img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
<div><h3>AC Repair</h3></div>
</div>

<div class="service-card" onclick="selectService('Refrigerator')">
<img src="https://images.unsplash.com/photo-1604014237800-1c9102c219da">
<div><h3>Refrigerator Repair</h3></div>
</div>

<div class="service-card" onclick="selectService('Air Cooler')">
<img src="https://images.unsplash.com/photo-1597008641621-b6efb5f8b84a">
<div><h3>Air Cooler Repair</h3></div>
</div>

<div class="service-card" onclick="selectService('Fan')">
<img src="https://images.unsplash.com/photo-1598300056393-4aac492f4344">
<div><h3>Fan Repair</h3></div>
</div>

</div>
</section>

<!-- BOOKING -->
<section id="booking">
<h2>Book a Service</h2>

<div class="booking">
<form onsubmit="sendWhatsApp();return false;">

<label>Name</label>
<input id="name" required>

<label>Phone</label>
<input id="phone" required>

<label>Appliance</label>
<select id="appliance" required>
<option value="">Select Appliance</option>
<option>AC</option>
<option>Refrigerator</option>
<option>Air Cooler</option>
<option>Fan</option>
<option>Other</option>
</select>

<label>Problem Description</label>
<textarea id="problem" required></textarea>

<button class="btn btn-primary" style="width:100%;margin-top:25px;">
Book on WhatsApp
</button>

</form>
</div>
</section>

<footer>
© 2026 Raja Technician Services • All Rights Reserved
</footer>

<!-- FLOATING -->
<div class="floating">
<a href="tel:9XXXXXXXXX" class="float-btn call">📞</a>
<a href="https://wa.me/919XXXXXXXXX" class="float-btn whatsapp">💬</a>
</div>

<script>
function selectService(service){
    document.getElementById("appliance").value = service;
    document.getElementById("booking").scrollIntoView({behavior:'smooth'});
}

function sendWhatsApp(){
    let msg =
`Hello Raja,

I want to book a repair service.

Name: ${name.value}
Phone: ${phone.value}
Appliance: ${appliance.value}
Problem: ${problem.value}`;

    window.open("https://wa.me/919XXXXXXXXX?text="+encodeURIComponent(msg),"_blank");
}
</script>

</body>
</html>
